---
layout: default
---

<div class="navigation mb-4">
	{% assign ab_sees = site.pages | where: "external_selector", "a-b-sees" | first %}
	<a href="{{ ab_sees.permalink }}">< Back to a.b sees directory</a>
</div>

{% if page.title %}
	<h2>{{ page.title | markdownify }}</h2>
{% endif %}

<div class="asset_wrapper">
	
	{% for src in page.img_srcs %}
		<div class="row">
			<div class="col col-md-6">
				<img
					src="{{ site.url }}/assets/img/white_papers/{{ src }}"
					alt="written words about {{ page.title }}"
					class="mb-4"
					width="100%"
				>
			</div>
			<div class="col col-md-6 d-flex align-items-center">
				<p><i>{{ src }}</i></p>
			</div>
		</div>
	{% endfor %}

</div>

<div class="article-wrapper">
  {{ content | markdownify }}
</div>
